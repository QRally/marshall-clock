<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRally - Digital Marshal Control</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --border: #2a2a2a;
      --accent: #ff9800;
      --danger: #f44336;
      --text: #ffffff;
      --text-dim: #a0a0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 480px; margin: 0 auto; min-height: 100vh; }

    /* Header & Status Bar */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status-container { display: flex; gap: 6px; }
    .status-badge { font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 12px; border: 1px solid transparent; }
    .status-online { background: #1b381e; color: #4caf50; border-color: #2e7d32; }
    .status-offline { background: #3a1c1c; color: #f44336; border-color: #7f1d1d; }
    .status-wakelock { background: #1c2d3a; color: #00bcd4; border-color: #00838f; }

    /* Controls Setup */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; }
    select { background: #000; color: var(--accent); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
    .clock { font-size: 1.4rem; font-weight: bold; color: var(--accent); font-family: monospace; }

    /* Display Screen */
    .display-screen { text-align: center; padding: 12px; border: 2px solid var(--accent); position: relative; }
    .display-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .car-number-val { font-size: 2.5rem; font-weight: bold; letter-spacing: 4px; height: 50px; line-height: 50px; }
    
    /* Penalty Indicator Badge */
    .penalty-badge { display: none; position: absolute; top: 8px; right: 8px; background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .penalty-badge.active { display: block; }

    /* Penalty Buttons */
    .penalty-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn-penalty { background: #262626; color: var(--text-dim); border: 1px solid var(--border); padding: 8px 0; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    .btn-penalty.selected { background: var(--danger); color: #fff; border-color: #ff6659; }

    /* Keypad Grid */
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .keypad-btn { background: #262626; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px 0; font-size: 1.4rem; font-weight: bold; cursor: pointer; }
    .keypad-btn:active { background: #333; }
    .btn-clr { color: var(--danger); }
    
    /* Log Action Button */
    .btn-log { width: 100%; background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 14px 0; font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; cursor: pointer; margin-bottom: 8px; }
    .btn-log:active { opacity: 0.9; }

    /* Recent Control Logs List */
    .log-container { background: var(--card-bg); border-radius: 12px; padding: 12px; max-height: 180px; margin-bottom: 30px; overflow-y: auto; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .log-item { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--accent); font-size: 0.9rem; }
    .log-item.has-penalty { border-left-color: var(--danger); }
    .log-tag { font-weight: bold; color: var(--accent); }
    .log-pen-tag { color: var(--danger); font-size: 0.75rem; font-weight: bold; margin-left: 6px; }
    .log-time { font-family: monospace; color: var(--text-dim); }
    .sync-status { font-size: 0.7rem; color: #ff9800; margin-left: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Rally Timing Control</h3>
    <div class="status-container">
      <span class="status-badge status-wakelock" id="wakeStatus">Lock Off</span>
      <span class="status-badge status-online" id="netStatus">Online</span>
    </div>
  </div>

  <!-- Control Point Selection & Live Clock -->
  <div class="card control-row">
    <div>
      <select id="controlPoint">
        <option value="MTC-01">MTC-01 (Main Exit)</option>
        <option value="TC-02">TC-02 (Mid Stage)</option>
        <option value="MTC-02">MTC-02 (Regroup In)</option>
      </select>
    </div>
    <div class="clock" id="liveClock">00:00:00</div>
  </div>

  <!-- Car Entry Box -->
  <div class="card display-screen">
    <div class="display-label">Entering Car #</div>
    <div class="car-number-val" id="carDisplay">---</div>
    <div class="penalty-badge" id="penaltyBadge">NONE</div>
  </div>

  <!-- Penalty Modifier Options -->
  <div class="penalty-grid">
    <button class="btn-penalty" onclick="togglePenalty('+1 MIN')">+1 MIN</button>
    <button class="btn-penalty" onclick="togglePenalty('+5 MIN')">+5 MIN</button>
    <button class="btn-penalty" onclick="togglePenalty('FAIL')">FAIL</button>
  </div>

  <!-- Keypad -->
  <div class="keypad-grid">
    <button class="keypad-btn" onclick="pressNum('1')">1</button>
    <button class="keypad-btn" onclick="pressNum('2')">2</button>
    <button class="keypad-btn" onclick="pressNum('3')">3</button>
    <button class="keypad-btn" onclick="pressNum('4')">4</button>
    <button class="keypad-btn" onclick="pressNum('5')">5</button>
    <button class="keypad-btn" onclick="pressNum('6')">6</button>
    <button class="keypad-btn" onclick="pressNum('7')">7</button>
    <button class="keypad-btn" onclick="pressNum('8')">8</button>
    <button class="keypad-btn" onclick="pressNum('9')">9</button>
    <button class="keypad-btn btn-clr" onclick="clearInput()">CLR</button>
    <button class="keypad-btn" onclick="pressNum('0')">0</button>
    <button class="keypad-btn btn-clr" onclick="backspace()">⌫</button>
  </div>

  <button class="btn-log" onclick="logTimeNow()">LOG TIME NOW</button>

  <!-- Recent Logs -->
  <div class="card">
    <div class="display-label" style="margin-bottom:6px;">Recent Control Logs</div>
    <div class="log-container" id="logStream"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLi3NMmoJJCeJFGU4oeABpQyivQe1Z6i0",
      authDomain: "the-regulator-rally.firebaseapp.com",
      projectId: "the-regulator-rally"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = "";
    let activePenalty = null;
    let wakeLock = null;

    // --- 1. Screen Wake Lock Engine ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wakeStatus').innerText = "Screen On";
          document.getElementById('wakeStatus').className = "status-badge status-wakelock";
        }
      } catch (err) {
        document.getElementById('wakeStatus').innerText = "Lock Err";
      }
    }

    // Re-apply wake lock when resuming app/tab
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    requestWakeLock(); // Initial trigger

    // --- 2. Live Clock & Online Monitoring ---
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);

    function updateNetStatus() {
      const statusEl = document.getElementById('netStatus');
      if (navigator.onLine) {
        statusEl.innerText = "Online";
        statusEl.className = "status-badge status-online";
        flushPendingQueue(); // Push offline items if reconnection occurs
      } else {
        statusEl.innerText = "Offline";
        statusEl.className = "status-badge status-offline";
      }
    }

    // --- 3. Keypad & UI Logic ---
    window.pressNum = function(num) {
      if (currentInput.length < 3) {
        currentInput += num;
        updateDisplay();
      }
    };

    window.clearInput = function() {
      currentInput = "";
      activePenalty = null;
      updatePenaltyUI();
      updateDisplay();
    };

    window.backspace = function() {
      currentInput = currentInput.slice(0, -1);
      updateDisplay();
    };

    function updateDisplay() {
      document.getElementById('carDisplay').innerText = currentInput || "---";
    }

    window.togglePenalty = function(type) {
      activePenalty = (activePenalty === type) ? null : type;
      updatePenaltyUI();
    };

    function updatePenaltyUI() {
      const badge = document.getElementById('penaltyBadge');
      document.querySelectorAll('.btn-penalty').forEach(btn => {
        btn.classList.toggle('selected', btn.innerText === activePenalty);
      });

      if (activePenalty) {
        badge.innerText = activePenalty;
        badge.classList.add('active');
      } else {
        badge.classList.remove('active');
      }
    }

    // --- 4. Store-First Logging Engine ---
    window.logTimeNow = async function() {
      if (!currentInput) return;

      const now = new Date();
      const payload = {
        id: 'log_' + Date.now(),
        carNumber: currentInput,
        controlPoint: document.getElementById('controlPoint').value,
        timestampISO: now.toISOString(),
        epochMs: now.getTime(),
        timeLogged: now.toTimeString().split(' ')[0],
        timeDisplay: now.toTimeString().split(' ')[0],
        penalty: activePenalty || "NONE",
        synced: false
      };

      // 1. Save Locally First
      saveToLocalQueue(payload);
      appendLogToUI(payload);
      window.clearInput();

      // 2. Try Firestore Sync immediately
      if (navigator.onLine) {
        await syncSinglePayload(payload);
      }
    };

    function saveToLocalQueue(payload) {
      let queue = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
      queue.unshift(payload);
      localStorage.setItem('qrally_logs', JSON.stringify(queue));
    }

    async function syncSinglePayload(payload) {
      try {
        await addDoc(collection(db, "control_logs"), {
          carNumber: payload.carNumber,
          controlPoint: payload.controlPoint,
          timestampISO: payload.timestampISO,
          epochMs: payload.epochMs,
          timeLogged: payload.timeLogged,
          timeDisplay: payload.timeDisplay,
          penalty: payload.penalty
        });
        markLocalAsSynced(payload.id);
      } catch (e) {
        console.error("Firestore deferral:", e);
      }
    }

    function markLocalAsSynced(id) {
      let queue = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
      queue = queue.map(item => item.id === id ? { ...item, synced: true } : item);
      localStorage.setItem('qrally_logs', JSON.stringify(queue));
      renderLocalHistory();
    }

    async function flushPendingQueue() {
      let queue = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
      const unsynced = queue.filter(item => !item.synced);
      for (let item of unsynced) {
        await syncSinglePayload(item);
      }
    }

    function appendLogToUI(data) {
      renderLocalHistory();
    }

    function renderLocalHistory() {
      const stream = document.getElementById('logStream');
      const queue = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
      stream.innerHTML = "";

      queue.slice(0, 20).forEach(data => {
        const item = document.createElement('div');
        item.className = `log-item ${data.penalty !== 'NONE' ? 'has-penalty' : ''}`;
        
        const penTag = data.penalty !== 'NONE' ? `<span class="log-pen-tag">[${data.penalty}]</span>` : '';
        const syncTag = data.synced ? '' : '<span class="sync-status">(Saving...)</span>';
        
        item.innerHTML = `
          <div>
            <span class="log-tag">[${data.controlPoint}]</span> 
            Car #${data.carNumber} ${penTag} ${syncTag}
          </div>
          <div class="log-time">${data.timeLogged}</div>
        `;
        stream.appendChild(item);
      });
    }

    // Initial Load
    renderLocalHistory();
    updateNetStatus();
  </script>
</body>
</html>
